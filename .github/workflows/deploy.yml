name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.html_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check that this run is still current
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.ref.replace(/^refs\/heads\//, '');
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branchName,
            });

            const isCurrent = branch.commit.sha === context.sha;
            if (!isCurrent) {
              core.notice(`Skipping stale deployment ${context.sha}; ${branch.commit.sha} is current on ${branchName}.`);
            }
            core.setOutput('is_current', String(isCurrent));

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.is_current == 'true'
        uses: actions/deploy-pages@v4
